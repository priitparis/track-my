name: Status SVG report

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libcairo (required by cairosvg for PNG rendering)
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install dependencies
        run: pip install -r tracking/automatic/svg-report/requirements.txt

      - name: Write service account key to a temp file
        run: echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-service-account.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Generate status SVGs and PNGs
        env:
          GCP_SA_KEY_PATH: ${{ runner.temp }}/gcp-service-account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_SCRAPER_TAB: Scraper
          GOOGLE_SHEET_EVENTS_TAB: Events
          OUTPUT_SVG_DIR: ${{ runner.temp }}/status
        run: python tracking/automatic/svg-report/generate_status_svg.py

      - name: Upload the images to the latest-status release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest-status "${{ runner.temp }}/status"/*.svg "${{ runner.temp }}/status"/*.png --clobber
